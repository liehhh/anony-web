{% extends "confess/base.html" %}
{% block content %}
{% load static %}
<div class="searchengine">
<h3>Search results for :  {{ query }}</h3>
{% if posts %}
    {% for post in posts %}
    <div class="HomePosts">
        <h2><a href="{% url 'confess-story' post.pk %}">{{ post.title }}</a></h2>
    </div>
    {% endfor %}
{% else %}
    <h3>No results</h3>
{% endif %}
</div>
{% endblock content %}
